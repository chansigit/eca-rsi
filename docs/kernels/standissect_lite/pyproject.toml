[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "standissect-lite"
version = "0.1.0"
description = "Minor-fragment detection inside existing single-cell clusters — the detection core of standissect, without the heavy stack."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "python-igraph",
    "leidenalg",
    "anndata",
]

[tool.setuptools.packages.find]
include = ["standissect_lite*"]
