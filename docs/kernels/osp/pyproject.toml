[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "osp-sc"   # PyPI distribution name (PyPI rejects "osp" as too similar to an existing "OSP"); import name stays `osp`
version = "0.1.0"
description = "One-sample-pipeline: per-sample scRNA-seq QC, clustering, DEG and self-contained HTML report"
readme = "README.md"
license = "MIT"
authors = [{ name = "chansigit" }]
requires-python = ">=3.10"
dependencies = [
    "scanpy",
    "igraph",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk", "openai-agents==0.22.0", "mcp>=1.19,<2"]

[tool.setuptools]
packages = ["osp", "osp._decontx"]
