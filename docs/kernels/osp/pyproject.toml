[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "osp-sc"   # PyPI distribution name (PyPI rejects "osp" as too similar to an existing "OSP"); import name stays `osp`
version = "0.1.1"
description = "Agentic single-cell QC and annotation pipeline: per-sample scRNA-seq QC, clustering, DEG, a self-contained HTML report, and an LLM annotation agent"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "chansigit" }]
requires-python = ">=3.10"
keywords = ["single-cell", "scRNA-seq", "quality-control", "cell-type-annotation", "scanpy", "llm-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "agent-harness-bridge==0.1.0",
    "scanpy",
    "igraph",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
]

[project.optional-dependencies]
agent = ["agent-harness-bridge[all]==0.1.0"]
test = ["pytest>=8", "ruff>=0.16"]

[project.urls]
Homepage = "https://github.com/chansigit/osp"
Documentation = "https://github.com/chansigit/osp#readme"
Changelog = "https://github.com/chansigit/osp/blob/main/docs/NEWS.md"
Issues = "https://github.com/chansigit/osp/issues"

[tool.setuptools]
packages = ["osp", "osp._decontx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
