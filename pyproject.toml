[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecarsi"
version = "0.4.7"
description = "eca-rsi: organize → persample (osp) → self-driving rounds of crosssample (msp) + zoomin (zmip), ledger, landing pages and serving; the kernels and the agent harness live in this repository (decision 0018)"
readme = "README.md"
license = "MIT"
authors = [{ name = "chansigit", email = "chansigit@gmail.com" }]
requires-python = ">=3.10"
# One repository (decision 0018): ecarsi, the kernels osp / msp / zmip, standissect_lite and harness_bridge.
# The dependencies are theirs together; production runs from the images (decision 0010), not from this list.
dependencies = [
    "anndata>=0.11",
    "scanpy[scrublet]>=1.10",
    "h5py",
    "numpy",
    "pandas>=2",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "adjustText",
    "igraph",
    "python-igraph",
    "leidenalg",
    "harmonypy>=2.0.0,<3",
    "stanhue>=1.1.0",
    "rich>=13",
]

[project.scripts]
eca-rsi = "ecarsi.__main__:main"

[project.optional-dependencies]
agent = ["openai-agents==0.22.3", "claude-agent-sdk>=0.2.163"]
deepseek = ["mcp>=1.19,<2", "PyYAML>=6", "uvicorn>=0.30", "sse-starlette>=3,<4"]
coordinator = ["temporalio==1.32.0", "openai-agents==0.22.3", "jsonschema>=4,<5"]

[tool.setuptools]
packages = ["ecarsi", "ecarsi.warm_pool", "ecarsi.agent", "ecarsi.control", "ecarsi.stages", "ecarsi.ui",
            "osp", "osp._decontx", "msp", "msp.integrate", "zmip", "standissect_lite", "harness_bridge", "genesets"]

[tool.setuptools.package-data]
ecarsi = ["prompts/*.md", "*.html"]
"ecarsi.ui" = ["static/*", "*.html"]
"ecarsi.warm_pool" = ["numba_site/sitecustomize.py"]
genesets = ["*.tsv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning:msp"]

# A minimal lint rule set (#48), held by tests/test_lint.py: one statement per line, no unused imports or variables,
# no undefined names. Formatting is not enforced.
[tool.ruff]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E701", "E702", "E703", "F401", "F841", "F821"]
