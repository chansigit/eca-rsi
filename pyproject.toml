[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecarsi"
version = "0.3.0"
description = "eca-rsi main line: organize → persample (osp) → self-driving rounds of crosssample (msp) + zoomin (zmip), ledger, landing pages and serving"
readme = "README.md"
license = "MIT"
authors = [{ name = "chansigit", email = "chansigit@gmail.com" }]
requires-python = ">=3.10"
# The kernels (osp, msp, zmip) are separate packages driven through
# `python -m osp|msp|zmip` subprocesses (OSP_PYTHON / MSP_PYTHON / ZMIP_PYTHON
# may point at other interpreters), so they are not import-time dependencies
# of ecarsi. Install them per INSTALL.md.
dependencies = [
    "agent-harness-bridge[all]>=0.2.14,<0.3",
    "anndata>=0.11",
    "scanpy",
    "h5py",
    "numpy",
    "pandas",
    "matplotlib",                  # ledger Sankey PNG
]

[project.scripts]
eca-rsi = "ecarsi.__main__:main"

[project.optional-dependencies]
pool = ["dask[distributed]>=2025.1"]
kernels = ["osp-sc[agent]>=0.1.3,<0.2", "msp-sc[agent]>=0.5.2,<0.6", "zmip>=0.3.9,<0.4"]
front = ["osp-sc[agent]>=0.1.3,<0.2"]  # tested source revision is recorded in FRONT_COMPATIBILITY.json

[tool.setuptools]
packages = ["ecarsi", "ecarsi.pool"]

[tool.setuptools.package-data]
ecarsi = ["prompts/*.md"]
